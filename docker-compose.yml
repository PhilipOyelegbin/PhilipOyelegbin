services:
  web:
    build: ./client
    ports:
      - "80:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: api
      NEXT_PUBLIC_HOST_URI: web
    depends_on:
      - api

  api:
    build: ./server
    environment:
      - PORT=3030
      - DATABASE_URL="mongodb+srv://philip:Mogdb@D0c.@db/portfolio"
    depends_on:
      - db

  db:
    image: mongo:latest
    environment:
      MONGO_INITDB_ROOT_USERNAME: philip
      MONGO_INITDB_ROOT_PASSWORD: Mogdb@D0c.
    volumes:
      - db-data:/data/db

volumes:
  db-data:
